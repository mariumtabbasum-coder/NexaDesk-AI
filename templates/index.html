<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexaDesk AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css',v=20261118) }}">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark"><i class="bi bi-stars"></i></span><span>NexaDesk <small>AI</small></span></div>
    <div class="side-label">WORKSPACE</div>
    <nav class="nav-list">
      <button class="nav-link active" data-view="dashboard"><i class="bi bi-grid-1x2"></i>Dashboard</button>
      <button class="nav-link" data-view="chat"><i class="bi bi-chat-square-text"></i>New Chat</button>
      <button class="nav-link" data-view="search"><i class="bi bi-search"></i>Knowledge Search</button>
      <button class="nav-link" data-view="knowledge"><i class="bi bi-database"></i>Knowledge Base</button>
      <button class="nav-link" data-view="history"><i class="bi bi-clock-history"></i>Chat History</button>
    </nav>
    <div class="side-label tools-label">TOOLS</div>
    <div class="tool-pills"><span><i class="bi bi-calculator"></i> Calculator</span><span><i class="bi bi-cloud-sun"></i> Weather</span><span><i class="bi bi-currency-exchange"></i> Currency</span></div>
    <div class="sidebar-bottom"><button class="nav-link" data-view="settings"><i class="bi bi-gear"></i>Settings</button><div class="profile-mini"><span class="avatar">N</span><div><b>NexaDesk AI</b><small>Knowledge assistant</small></div></div></div>
  </aside>
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <main class="main-shell">
    <header class="topbar">
      <div class="topbar-left"><div class="mobile-brand"><span class="brand-mark"><i class="bi bi-stars"></i></span><span class="mobile-brand-name">NexaDesk <small>AI</small></span></div><div class="breadcrumb"><span>Workspace</span><i class="bi bi-chevron-right"></i><b id="pageTitle">Dashboard</b></div></div>
      <div class="topbar-actions"><span class="status-chip"><span class="status-dot"></span>Assistant ready</span><button class="icon-btn" data-view="settings" title="Settings"><i class="bi bi-sliders"></i></button><span class="avatar top-avatar">N</span><button class="hamburger" id="menuBtn" aria-label="Open menu"><i class="bi bi-list"></i></button></div>
    </header>
    <div class="page-content" id="pageContent"></div>
  </main>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static',filename='js/app.js',v=20261118) }}"></script>
</body>
</html>
